name: Build unsigned IPA

# Splatelier 专用：工程在 App/ 子目录，由 xcodegen 从 App/project.yml 生成。
# 需要 Xcode 16+ / iOS 18 SDK，依赖 mlx-swift，编译偏重。

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          brew install xcodegen
          cd App
          xcodegen generate
          ls -d *.xcodeproj

      - name: Build Release (unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project App/Splatelier.xcodeproj \
            -scheme Splatelier \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package into IPA
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          test -n "$APP" || { echo "没有找到 .app"; exit 1; }
          NAME=$(basename "$APP" .app)
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "${NAME}-unsigned.ipa" Payload
          ls -lh "${NAME}-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: '*-unsigned.ipa'
          if-no-files-found: error
